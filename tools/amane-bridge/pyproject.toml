# Standalone manifest for the amane bridge (ADR-0043). amane's transitive dependencies are fully pinned by this directory's `uv.lock`,
# independent of Peach's main venv. Desktop and Docker prepare the bundled environment at build time; source deployments prepare it from the lock in the data directory.
#
# 唯一直接依赖是 amane 的一个 revision。升级是人做的事：改这里的 sha，跑
# `uv lock --project tools/amane-bridge`，读上游 diff 确认站点解析器的字段语义没变，
# 再同批更新 `docs/REUSE.md` 与 `src/peach/metadata_amane.py` 的复核记录。
[project]
name = "peach-amane-bridge"
version = "0.1.0"
description = "Peach 调用 amane 刮削站点的薄桥子进程"
requires-python = ">=3.14"
license = "AGPL-3.0-or-later"
dependencies = [
  "amane @ git+https://github.com/sqzw-x/amane@fd9294fbe5b4aa88ce1df84d534f6816ad9460d5",
]

[tool.uv]
# 桥不是一个包，只有一个脚本；uv 只管 venv 与锁。
package = false
